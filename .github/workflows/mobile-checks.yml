name: Mobile checks

# On every push and pull request: the shared TypeScript core's typecheck and
# unit tests, and the mobile app's typecheck. This workflow uses no secrets
# and deploys nothing. `npm ci --ignore-scripts` runs no package's install
# script.

on:
  push:
    branches: [main, react]
  pull_request:
    branches: [main, react]
  workflow_dispatch:

concurrency:
  group: mobile-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Shared + mobile typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            shared/package-lock.json
            mobile/package-lock.json
      - name: Shared TypeScript core — typecheck + unit tests
        working-directory: shared
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test
      - name: Mobile app — typecheck
        working-directory: mobile
        run: |
          npm ci --ignore-scripts
          npx --no -- tsc --noEmit
