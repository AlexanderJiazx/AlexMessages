appId: com.alexanderjia.messages
---
# Settings: grouped root list → each section pushes its own page.
- runFlow: subflows/login.yaml
- tapOn: "Settings"
- assertVisible: "Profile"
- assertVisible: "Account"
- assertVisible: "Notifications"
- assertVisible: "Data"
- assertVisible: "Log Out"
- tapOn: "Profile"
- assertVisible: "Display name"
- assertVisible: "Bio"
- tapOn: "Back"
- tapOn: "Account"
- assertVisible: "Update Password"
- assertVisible: "Log Out of All Devices"
- assertVisible: "Delete Account…"
- tapOn: "Back"
- tapOn: "Notifications"
- assertVisible: "Direct message alerts"
- tapOn: "Back"
- tapOn: "Data"
- assertVisible: "Export my data"
- tapOn: "Close"
- assertVisible: "Messages"
