appId: com.alexanderjia.messages
---
# Voice message, iOS 26 Messages-style: waveform → recording (live waveform,
# timer, stop) → review (X, play, duration, transcribe, send) → discard.
- runFlow: subflows/login.yaml
- tapOn: "Conversation with Bob.*"
- tapOn: "Dictate"
- assertVisible: "Stop recording"
- assertNotVisible: "Attach"
- tapOn: "Stop recording"
- assertVisible: "Play voice message"
- assertVisible: "Transcribe to text"
- assertVisible: "Send voice message"
- tapOn: "Delete voice message"
- assertVisible: "Dictate"
- assertVisible: "Attach"
