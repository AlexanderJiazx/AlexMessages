appId: com.alexanderjia.messages
---
# Reply and edit flows on a live DM. Unique per-run texts make every
# selector match exactly one (the just-sent) message — immune to history
# accumulated by earlier runs.
- evalScript: ${output.TARGET = 'e2e target ' + Date.now()}
- evalScript: ${output.REPLY = 'e2e reply ' + Date.now()}
- evalScript: ${output.EDITED = 'e2e edited ' + Date.now()}
- runFlow: subflows/login.yaml
- tapOn: "Conversation with Bob.*"

# Seed a fresh message to act on (newest = always visible at bottom).
- tapOn:
    id: "composer-input"
- inputText: "${output.TARGET}"
# iOS keeps the soft keyboard up, covering the newest bubble — dismiss it
# only when the keyboard is actually open (Android's injected text never
# opens it, and a stray dismiss would pop the screen instead). Maestro's
# typing on iOS can drop the soft keyboard and bring it back mid-input
# (CLAUDE.md → Maestro typing on iOS); settle before and after the dismissal
# so Send is tapped where it rests, not on the keyboard or while the
# composer slides.
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "return"
    commands:
      - hideKeyboard
- waitForAnimationToEnd
- tapOn: "Send"
# hideKeyboard swipes, and this screen dismisses the keyboard interactively
# (as Messages does): a short swipe brings the keyboard back, and the tap
# can land while the composer slides. Tap again only while the text is still
# in the composer, checked once the screen has settled; a blind retry would
# hit the microphone button that replaces Send once the text is gone.
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "composer-input"
        text: "${output.TARGET}"
    commands:
      - tapOn:
          text: "Send"
          optional: true
# Sent means the composer gave the text up (a match on the composer's own
# text would otherwise pass the next check without a send).
- assertNotVisible:
    id: "composer-input"
    text: "${output.TARGET}"
- runFlow:
    when:
      visible: "return"
    commands:
      - hideKeyboard
- assertVisible: "${output.TARGET}"

# --- Reply ---
- longPressOn: "${output.TARGET}"
- tapOn: "Reply"
- assertVisible: ".*Replying to.*"
- tapOn:
    id: "composer-input"
- inputText: "${output.REPLY}"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "return"
    commands:
      - hideKeyboard
- waitForAnimationToEnd
- tapOn: "Send"
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        id: "composer-input"
        text: "${output.REPLY}"
    commands:
      - tapOn:
          text: "Send"
          optional: true
- assertNotVisible:
    id: "composer-input"
    text: "${output.REPLY}"
- runFlow:
    when:
      visible: "return"
    commands:
      - hideKeyboard
- assertVisible: ".*${output.REPLY}.*"
- assertVisible: ".*replied to.*"

# --- Edit own message ---
- longPressOn: ".*${output.REPLY}.*"
- tapOn: "Edit"
- assertVisible: ".*Edit message.*"
- tapOn:
    id: "edit-input"
- eraseText
- inputText: "${output.EDITED}"
- waitForAnimationToEnd
- runFlow:
    when:
      visible: "return"
    commands:
      - hideKeyboard
- waitForAnimationToEnd
- tapOn: "Save"
- assertVisible: ".*${output.EDITED}.*"
- assertVisible: "Edited"
