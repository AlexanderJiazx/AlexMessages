appId: com.alexanderjia.messages
---
# New-conversation sheet: compose button → username lookup → open.
- runFlow: subflows/login.yaml
- tapOn: "New conversation"
- assertVisible: "Username"
- tapOn: "Username"
- inputText: "tester"
# Android's hideKeyboard is a Back press when no keyboard is up (it closed
# the sheet); only the iOS keyboard shows "return".
- runFlow:
    when:
      visible: "return"
    commands:
      - hideKeyboard
- tapOn: "Open conversation"
- assertVisible:
    id: "composer-input"
- assertVisible: "Open Test User's profile"
