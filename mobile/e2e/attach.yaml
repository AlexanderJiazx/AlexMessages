appId: com.alexanderjia.messages
---
# Attach sheet: + button → iOS action sheet with picker options.
- runFlow: subflows/login.yaml
- tapOn: "Conversation with Bob.*"
- tapOn: "Attach"
- assertVisible: "Photo Library"
- assertVisible: "Files"
- runFlow: subflows/dismiss-menu.yaml
- assertVisible:
    id: "composer-input"
